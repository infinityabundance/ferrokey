[package]
name = "ferrokey-terminal"
description = "The embedded PTY terminal engine for Ferrokey's terminal workspace mode: bounded ANSI parser, grid, scrollback, key encoder, PTY and child-session lifecycle"
version = "0.1.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
ferrokey-core.workspace = true
nix.workspace = true
libc = "0.2"
log.workspace = true
thiserror.workspace = true
ab_glyph = "0.2.29"
unicode-width = "0.2.1"

[dev-dependencies]
# The real US layout for the shell-row byte fixtures (WS5 §5.14): the
# fixtures must encode through the production layout, not an empty one.
ferrokey-layouts.workspace = true

[lints.rust]
# The workspace forbids unsafe; this crate relaxes to `deny` so the single
# audited raw-syscall module (src/syscall.rs, TIOCSWINSZ) can carry an
# explicit `#[allow]`. Every other module still fails the build on unsafe.
unsafe_code = "deny"

[lints.clippy]
# Mirrors the workspace allow-list (workspace lints cannot be inherited
# together with a local override).
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
struct_field_names = "allow"
enum_glob_use = "allow"
wildcard_imports = "allow"
map_unwrap_or = "allow"
return_self_not_must_use = "allow"
unnecessary_wraps = "allow"
default_constructed_unit_structs = "allow"
unused_self = "allow"
manual_let_else = "allow"
