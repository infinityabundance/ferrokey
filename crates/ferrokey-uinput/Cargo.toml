[package]
name = "ferrokey-uinput"
description = "Ferrokey uinput device: explicit capability set, event emission, defensive held-key ledger"
version = "0.1.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"

# Workspace lints are not inherited here: Phase 3 §82 requires the uinput
# configuration ioctls, isolated into `src/ffi.rs` — a tiny, fully-documented
# module where every unsafe block states its preconditions and postconditions.
# The rest of the crate remains `deny(unsafe_code)` (set in lib.rs), so any
# future unsafe code outside `ffi` fails the build.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Mirrors the workspace allow-list (workspace lints cannot be inherited
# together with a local override).
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
struct_field_names = "allow"
enum_glob_use = "allow"
wildcard_imports = "allow"
map_unwrap_or = "allow"
return_self_not_must_use = "allow"
unnecessary_wraps = "allow"
default_constructed_unit_structs = "allow"
unused_self = "allow"
manual_let_else = "allow"

[dependencies]
ferrokey-core.workspace = true
log.workspace = true
nix.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
