[package]
name = "ferrokey-layouts"
description = "Ferrokey keyboard layout data files and loaders (builtin YAML layouts, xkbcommon bridge)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
ferrokey-core.workspace = true
serde.workspace = true
serde_yaml.workspace = true
log.workspace = true
thiserror.workspace = true
# Real xkbcommon bindings (feature `xkb`). `default-features = false` keeps
# the wayland/x11 feature flags out: Ferrokey only needs the core keymap API.
xkbcommon = { version = "0.9.0", default-features = false, optional = true }

[features]
default = ["builtin"]
builtin = []
xkb = ["dep:xkbcommon"]

