[package]
name = "ferrokey-protocol"
description = "Ferrokey wire protocol: length-prefixed binary messages between ferrokey (UI) and ferrokeyd"
version = "0.1.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
# The cargo-fuzz harness lives under fuzz/ and is a separate (nightly-only)
# package; it must not ship in the published crate.
exclude = ["/fuzz"]

[lints]
workspace = true

[dependencies]
ferrokey-core.workspace = true
thiserror.workspace = true
log.workspace = true
nix.workspace = true

