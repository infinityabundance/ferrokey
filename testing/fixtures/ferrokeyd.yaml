# ferrokeyd configuration used inside the court VMs (Phase 3).
#
# Security model: the supervisor (root, briefly) parses this config, the
# bootstrap component creates the virtual keyboard, and the runtime broker
# (`serve`) drops to the dedicated unprivileged `ferrokeyd` identity with
# zero capabilities, NO_NEW_PRIVS and a seccomp allowlist. The unprivileged
# `court` user (uid 1000) is whitelisted via SO_PEERCRED.
socket_path: /run/ferrokeyd/ferrokeyd.sock
allowed_uids: [1000]
allowed_gids: []
max_connections: 4
rate:
  burst: 400
  per_second: 400
max_held_keys: 16
device_name: "Ferrokey Virtual Keyboard"
socket_mode: 438  # 0o666: the socket must be reachable by the unprivileged
                  # UI; the real authority is the SO_PEERCRED whitelist.
service_user: ferrokeyd
service_group: ferrokeyd
