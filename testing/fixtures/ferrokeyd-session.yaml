# ferrokeyd configuration for the session-lifetime court (§28, §99).
#
# The broker is bound to the logind session scope session-99.scope: only
# clients whose cgroup contains that scope are authorized (the court moves
# its clients into a matching cgroup). The runtime seccomp filter is widened
# by exactly one narrowly-gated openat (peer cgroup lookup) — see
# sandbox.rs SessionGate.
socket_path: /run/ferrokeyd/ferrokeyd.sock
allowed_uids: [1000]
allowed_gids: []
max_connections: 4
rate:
  burst: 400
  per_second: 400
max_held_keys: 16
device_name: "Ferrokey Virtual Keyboard"
socket_mode: 438  # 0o666: the socket must be reachable by the unprivileged
                  # UI; the real authority is the SO_PEERCRED whitelist +
                  # the session-scope binding.
service_user: ferrokeyd
service_group: ferrokeyd
session_scope: session-99.scope
