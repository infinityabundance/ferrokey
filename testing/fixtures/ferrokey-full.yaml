# ferrokey UI configuration: full desktop keyboard view.
#
# Used by the full-desktop court: the complete keyboard (function row, nav
# cluster, keypad, media/brightness keys) must deliver real kernel key events.
layout: us
view: full
socket_path: /run/ferrokeyd/ferrokeyd.sock
width: 920
height: 342
x11_display: ":0"
sticky:
  latch_enabled: true
  tap_timeout_ms: 400
repeat:
  enabled: true
  delay_ms: 500
  cadence_ms: 30
force_degraded_banner: false
text_mode: false
scale: 1.0
