<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The document title overrides BrowserWindow's title; it must match the
     window-search pattern the court uses (ferrokey-test-target-electron). -->
<title>ferrokey-test-target-electron</title>
<style>
  html, body { height: 100%; margin: 0; }
  #t { width: 100%; height: 100%; font-size: 22px; padding: 8px;
       box-sizing: border-box; }
</style>
</head>
<body>
<input id="t" autofocus>
<script>
  "use strict";
  // Every input change is reported over IPC to the main process, which
  // forwards it to the reporter socket (a machine-readable oracle).
  document.getElementById("t").addEventListener("input", function () {
    require("electron").ipcRenderer.send("text", this.value);
  });
</script>
</body>
</html>
