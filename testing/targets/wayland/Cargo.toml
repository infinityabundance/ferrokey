[package]
name = "ferrokey-test-target-wayland"
description = "Court target: xdg_toplevel window reporting focus and key events"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ferrokey-test-target-wayland"
path = "src/main.rs"

[dependencies]
ferrokey-test-common = { path = "../common" }
wayland-client.workspace = true
wayland-protocols = { version = "0.32.13", features = ["client"] }
log = "0.4"

[lints.rust]
unsafe_code = "forbid"
