#cloud-config
# Ferrokey Wayland court VM: sway (wlroots) compositor nested in the dummy X
# server (pixman renderer + X11 backend — no GPU needed), with XWayland.
# wlroots is the reference zwlr_layer_shell_v1 implementation and the
# protocol's home (zwlr = wlroots); its X11 backend honours
# keyboard_interactivity=none and delivers XI2 touch, so the layer-shell
# no-focus + touch contracts are testable for real. KWin's X11 backend was
# dropped: it advertises no touch seat and steals keyboard focus on layer
# clicks, so the layer-shell contract cannot be exercised on it.
ssh_pwauth: false
disable_root: false

users:
  - name: court
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - "__COURT_SSH_PUBKEY__"

package_update: true
packages:
  - sway
  - swaybg
  - dbus
  - xwayland
  - xserver-xorg-video-dummy
  - xserver-xorg-core
  - xinit
  - x11-utils
  - xdotool
  - xterm
  - fonts-dejavu-core
  - evtest
  - libinput-tools
  - xinput
  - procps
  - curl
  - jq
  - libgtk-3-0
  - libqt6widgets6
  - openbox

write_files:
  # Headless courts: let any local user start the dummy-driver X server
  # (the Xorg.wrap console-user check would otherwise refuse SSH-only users).
  - path: /etc/X11/Xwrapper.config
    content: |
      allowed_users=anybody
      needs_root_rights=yes

  - path: /etc/X11/xorg.conf.d/99-ferrokey-dummy.conf
    content: |
      Section "Device"
          Identifier  "DummyDevice"
          Driver      "dummy"
          VideoRam    65536
      EndSection

      Section "Monitor"
          Identifier  "DummyMonitor"
          HorizSync   5.0 - 1000.0
          VertRefresh 5.0 - 1000.0
          Modeline "1280x720" 74.48 1280 1336 1472 1664 720 721 724 746
      EndSection

      Section "Screen"
          Identifier  "DummyScreen"
          Device      "DummyDevice"
          Monitor     "DummyMonitor"
          DefaultDepth 24
          SubSection "Display"
              Depth 24
              Modes "1280x720"
          EndSubSection
      EndSection

runcmd:
  - [ systemctl, disable, --now, systemd-resolved ]
  - [ bash, /provision/10-base.sh ]
