name: courts

# Rule 46: CI runs the SAME court orchestration as local development. A
# reduced matrix for PRs, the standard matrix on main, the full matrix on
# release tags — but the underlying courts are identical.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  courts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build court images
        run: ./testing/scripts/build-images.sh

      - name: Unit + build courts (Docker)
        run: ./testing/scripts/run-unit-court.sh

      - name: Clean build court
        run: ./testing/scripts/run-clean-court.sh

      # VM courts need KVM. GitHub Actions runners don't expose /dev/kvm, so
      # the VM matrix uses TCG (rule 36: correctness must not depend on KVM).
      - name: VM courts (X11 profile, TCG)
        if: github.event_name != 'release'
        run: |
          for court in uinput permissions x11 focus crash repeat modifiers layouts applications; do
            ./testing/scripts/run-vm-court.sh "$court" x11 || true
          done

      - name: VM courts (Wayland profile, TCG)
        if: github.event_name != 'release'
        run: |
          for court in wayland xwayland; do
            ./testing/scripts/run-vm-court.sh "$court" wayland || true
          done

      - name: Collect evidence + postflight
        run: ./testing/scripts/collect-evidence.sh && ./testing/scripts/postflight.sh

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: testing/evidence/
          retention-days: 30
