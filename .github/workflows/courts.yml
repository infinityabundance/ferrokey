name: courts

# Rule 46: CI runs the SAME court orchestration as local development —
# `run-all-courts.sh` is the single entrypoint (rule 45), so a failure in
# any court (including the SEC.* security courts) makes CI RED (§94: no
# `|| true` may mask a failed receipt).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  fuzz:
    # Rule 71: the protocol decoder is a privilege boundary, so the
    # "hostile-input resistant" claim gets a real libFuzzer harness in CI.
    # libFuzzer needs nightly; the deterministic stress tests in the unit
    # court cover the same property on stable. Timeboxed so PRs stay fast.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz the protocol decoder
        run: |
          cd crates/ferrokey-protocol/fuzz
          cargo +nightly fuzz run fuzz_decoder -- \
            -max_total_time=180 \
            -rss_limit_mb=2048 \
            -timeout=10

  courts:
    runs-on: ubuntu-latest
    # The full matrix (incl. the §93 mutation courts and the long-run soak)
    # runs under TCG (GitHub runners expose no /dev/kvm), so allow a wide
    # budget. SOAK_SECONDS is shortened for PRs; the release gate runs the
    # full-duration soak.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Full court suite (incl. SEC.* security courts)
        env:
          SOAK_SECONDS: ${{ github.event_name == 'release' && 300 || 120 }}
        run: ./testing/scripts/run-all-courts.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: testing/evidence/
          retention-days: 30
