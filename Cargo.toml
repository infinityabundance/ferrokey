[workspace]
resolver = "2"
members = [
    "crates/ferrokey-core",
    "crates/ferrokey-protocol",
    "crates/ferrokey-uinput",
    "crates/ferrokey-layouts",
    "crates/ferrokey-surface",
    "apps/ferrokeyd",
    "apps/ferrokey",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ferrokey/ferrokey"
rust-version = "1.96"

[workspace.dependencies]
# --- core ---
anyhow = "1.0.104"
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
log = { version = "0.4", features = ["std"] }

# --- Linux input ---
evdev = "0.13.2"
nix = { version = "0.31.3", features = ["socket", "uio", "user", "poll", "signal", "mman", "fs"] }

# --- Wayland ---
wayland-client = "0.31.15"
wayland-protocols = "0.32.13"
wayland-protocols-wlr = "0.3.12"
wayland-backend = "0.3.16"

# --- X11 ---
x11rb = { version = "0.14.0", features = ["allow-unsafe-code"] }

# --- UI ---
slint = { version = "1.17.1", default-features = false, features = [
    "std",
    "renderer-software",
    "compat-1-2",
] }
slint-build = "1.17.1"

# --- runtime config ---
dirs = "6.0"
xdg = "2.6"

# --- dev ---
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Groups are set to priority -1 so the per-lint `allow`s below (priority 0)
# can override them.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Cosmetic/opinionated rules that add noise without catching bugs. The
# meaningful strictness (pedantic + all) stays enabled.
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
struct_field_names = "allow"
enum_glob_use = "allow"
wildcard_imports = "allow"
map_unwrap_or = "allow"
return_self_not_must_use = "allow"
unnecessary_wraps = "allow"
default_constructed_unit_structs = "allow"
unused_self = "allow"
manual_let_else = "allow"
