[package]
name = "ferrokey"
description = "The Ferrokey on-screen keyboard (UI) and workspace umbrella: preserves target focus via kernel-level input injection"
version = "0.1.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
# The umbrella is a thin re-export crate; ship only the manifest and lib.rs.
# The library crates it re-exports are published under their own names, so
# their sources (and the apps/courts that consume them) stay out of the
# tarball.
exclude = ["/crates", "/testing", "/target", "/.github"]

[dependencies]
ferrokey-core.workspace = true
ferrokey-layouts.workspace = true
ferrokey-protocol.workspace = true
ferrokey-surface.workspace = true
ferrokey-terminal.workspace = true
ferrokey-uinput.workspace = true
slint.workspace = true
log.workspace = true
nix.workspace = true
serde.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
thiserror.workspace = true

[features]
# The app links real libxkbcommon so system layouts/variants (de@neo,
# us(intl)) load at runtime; ferrokey-layouts itself keeps xkb optional.
default = ["xkb"]
xkb = ["ferrokey-layouts/xkb"]

[build-dependencies]
slint-build.workspace = true

[lints.rust]
# The Slint code generator emits `#[allow(unsafe_code)]` in its output, so
# `forbid` is not usable here (unlike the library crates). `deny` still
# fails the build on any *unannotated* unsafe code.
unsafe_code = "deny"

[lints.clippy]
# Groups at priority -1 so the allows below (priority 0) override them.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Mirrors the workspace allow-list (workspace lints cannot be inherited
# together with a local override).
missing_errors_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
struct_field_names = "allow"
enum_glob_use = "allow"
wildcard_imports = "allow"
map_unwrap_or = "allow"
return_self_not_must_use = "allow"
unnecessary_wraps = "allow"
default_constructed_unit_structs = "allow"
unused_self = "allow"
manual_let_else = "allow"

[workspace]
resolver = "2"
members = [
    "crates/ferrokey-core",
    "crates/ferrokey-protocol",
    "crates/ferrokey-uinput",
    "crates/ferrokey-layouts",
    "crates/ferrokey-surface",
    "crates/ferrokey-terminal",
    "crates/ferrokeyd",
    "xtask",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/infinityabundance/ferrokey"
rust-version = "1.96"

[workspace.dependencies]
# --- core ---
anyhow = "1.0.104"
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
log = { version = "0.4", features = ["std"] }

# --- Linux input ---
evdev = "0.13.2"
nix = { version = "0.31.3", features = ["socket", "uio", "user", "poll", "signal", "mman", "fs", "dir", "term", "process"] }

# --- Wayland ---
wayland-client = "0.31.15"
wayland-protocols = "0.32.13"
wayland-protocols-wlr = "0.3.12"
wayland-backend = "0.3.16"

# --- X11 ---
x11rb = { version = "0.14.0", features = ["allow-unsafe-code"] }

# --- UI ---
slint = { version = "1.17.1", default-features = false, features = [
    "std",
    "renderer-software",
    "compat-1-2",
] }
slint-build = "1.17.1"

# --- runtime config ---
dirs = "6.0"
xdg = "2.6"

# --- dev ---
tempfile = "3.20"

# --- ferrokey workspace crates ---
# version + path: cargo resolves the path locally during development, and
# replaces it with the crates.io version when publishing (a bare path
# dependency is rejected by `cargo publish`).
ferrokey-core = { version = "0.1.2", path = "crates/ferrokey-core" }
ferrokey-layouts = { version = "0.1.2", path = "crates/ferrokey-layouts" }
ferrokey-protocol = { version = "0.1.2", path = "crates/ferrokey-protocol" }
ferrokey-surface = { version = "0.1.2", path = "crates/ferrokey-surface" }
ferrokey-terminal = { version = "0.1.1", path = "crates/ferrokey-terminal" }
ferrokey-uinput = { version = "0.1.2", path = "crates/ferrokey-uinput" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Groups are set to priority -1 so the per-lint `allow`s below (priority 0)
# can override them.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Cosmetic/opinionated rules that add noise without catching bugs. The
# meaningful strictness (pedantic + all) stays enabled.
missing_errors_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
struct_field_names = "allow"
enum_glob_use = "allow"
wildcard_imports = "allow"
map_unwrap_or = "allow"
return_self_not_must_use = "allow"
unnecessary_wraps = "allow"
default_constructed_unit_structs = "allow"
unused_self = "allow"
manual_let_else = "allow"
